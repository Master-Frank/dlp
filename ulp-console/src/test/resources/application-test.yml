# 集成测试专用配置：补齐生产 yml 没有显式声明、IT 才用得到的字段。
# 容器 endpoint 由 AbstractIntegrationTest 的 @DynamicPropertySource 注入，这里不再重复。
ulp:
  server:
    portal-public-base-url: http://localhost
    console-public-base-url: http://localhost
    open-api-public-base-url: http://localhost
  demo:
    enabled: false
  mfa:
    # Test-only KEK: Base64 of "test-mfa-kek-for-tests-only-xxxx" (32 bytes).
    # 集成测试用固定值即可；MfaSecretCipher.validateKek 只校验长度/格式，不绑特定值。
    key-encryption-key: dGVzdC1tZmEta2VrLWZvci10ZXN0cy1vbmx5LXh4eHg=
